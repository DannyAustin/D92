error_log C:/Users/Danny/Documents/Code/Perplexity/d92/nginx/logs/error.log;
pid C:/Users/Danny/Documents/Code/Perplexity/d92/nginx/logs/nginx.pid;

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Log configuration
    access_log    C:/Users/Danny/Documents/Code/Perplexity/d92/nginx/logs/access.log;

    sendfile        on;
    keepalive_timeout  65;

    # Required temp directories
    client_body_temp_path   C:/Users/Danny/Documents/Code/Perplexity/d92/temp/client_body_temp;
    proxy_temp_path         C:/Users/Danny/Documents/Code/Perplexity/d92/temp/proxy_temp;
    fastcgi_temp_path       C:/Users/Danny/Documents/Code/Perplexity/d92/temp/fastcgi_temp;
    uwsgi_temp_path         C:/Users/Danny/Documents/Code/Perplexity/d92/temp/uwsgi_temp;
    scgi_temp_path          C:/Users/Danny/Documents/Code/Perplexity/d92/temp/scgi_temp;

    server {
        listen       80;
        server_name  localhost;

        # Root directory for serving static files
        root   C:/Users/Danny/Documents/Code/Perplexity/d92/frontend/build;
        index  index.html;

        # Enable directory listing (optional)
        autoindex off;

        # Set proper permissions
        location / {
            try_files $uri $uri/ /index.html;
            allow all;
        }

        # Serve static files
        location /static/ {
            alias C:/Users/Danny/Documents/Code/Perplexity/d92/frontend/build/static/;
            allow all;
        }

        # Proxy API requests to Node.js backend
        location /api/ {
            proxy_pass http://localhost:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
